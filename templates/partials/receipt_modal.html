<!-- ═══ Receipt Modal ═══ -->
<div id="receipt-modal" style="display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,0.45);backdrop-filter:blur(3px);padding:24px;overflow-y:auto;">
  <div class="receipt-card" style="max-width:560px;margin:40px auto;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,0.18);overflow:hidden;">
    <!-- Header -->
    <div style="background:linear-gradient(135deg,var(--brand),#2558A0);color:#fff;padding:24px 28px;">
      <div style="font-size:1.5rem;font-weight:800;letter-spacing:-0.02em;">&#128138; Pulse Pharmacy</div>
      <div style="font-size:0.85rem;opacity:0.85;margin-top:4px;">Official Sale Receipt</div>
    </div>
    <!-- Meta -->
    <div style="padding:22px 28px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div>
        <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);">Bill No.</div>
        <div id="r-bill-no" style="font-weight:800;font-size:1.05rem;color:var(--brand);"></div>
      </div>
      <div>
        <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);">Date</div>
        <div id="r-date" style="font-weight:600;"></div>
      </div>
      <div>
        <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);">Customer Name</div>
        <div id="r-customer-name" style="font-weight:600;"></div>
      </div>
      <div>
        <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);">Customer Phone</div>
        <div id="r-customer-phone" style="font-weight:600;"></div>
      </div>
      <div style="grid-column:1/-1;">
        <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);">Processed By</div>
        <div id="r-staff-name" style="font-weight:600;"></div>
      </div>
    </div>
    <!-- Items -->
    <div style="padding:18px 28px;">
      <table style="width:100%;border-collapse:collapse;font-size:0.875rem;">
        <thead>
          <tr style="border-bottom:2px solid var(--border);">
            <th style="text-align:left;padding:8px 0;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);">Medicine</th>
            <th style="text-align:center;padding:8px 0;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);">Qty</th>
            <th style="text-align:right;padding:8px 0;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);">Unit</th>
            <th style="text-align:right;padding:8px 0;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);">Total</th>
          </tr>
        </thead>
        <tbody id="r-items"></tbody>
      </table>
    </div>
    <!-- Total -->
    <div style="padding:16px 28px 20px;border-top:2px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
      <span style="font-weight:700;font-size:1rem;">Grand Total</span>
      <span id="r-total" style="font-weight:800;font-size:1.25rem;color:var(--success);"></span>
    </div>
    <!-- Actions -->
    <div style="padding:0 28px 24px;display:flex;gap:12px;">
      <button onclick="window.print()" class="btn-action primary" style="flex:1;">&#128424; Print</button>
      <button onclick="closeReceipt()" class="btn-action secondary" style="flex:1;">&#10005; Close</button>
    </div>
  </div>
</div>

<script>
  function openReceipt(billNo) {
    fetch(`/api/get_bill/${billNo}`)
      .then(r => r.json())
      .then(data => {
        if (!data.success) { alert('Could not load receipt: ' + data.error); return; }
        const b = data.bill;
        document.getElementById('r-bill-no').textContent        = b.Bill_No;
        document.getElementById('r-date').textContent           = b.SaleDate || '—';
        document.getElementById('r-customer-name').textContent  = b.Customer_Name  || '—';
        document.getElementById('r-customer-phone').textContent = b.Customer_Phone || '—';
        document.getElementById('r-staff-name').textContent     = b.Staff_Name     || '—';
        document.getElementById('r-total').textContent          = `\u20b9 ${parseFloat(b.Total_Amount).toFixed(2)}`;

        let rows = '';
        data.items.forEach(item => {
          rows += `
            <tr style="border-bottom:1px dashed var(--border);">
              <td style="padding:10px 0;font-weight:600;">${item.drug_name}</td>
              <td style="padding:10px 0;text-align:center;">${item.Qty_Sold}</td>
              <td style="padding:10px 0;text-align:right;color:var(--text-muted);">\u20b9${parseFloat(item.Unit_Selling_Price).toFixed(2)}</td>
              <td style="padding:10px 0;text-align:right;font-weight:700;">\u20b9${parseFloat(item.line_total).toFixed(2)}</td>
            </tr>`;
        });
        document.getElementById('r-items').innerHTML = rows || `<tr><td colspan="4" style="padding:20px;text-align:center;color:var(--text-muted);">No items found.</td></tr>`;
        document.getElementById('receipt-modal').style.display = 'block';
      })
      .catch(err => alert('Network error: ' + err));
  }

  function closeReceipt() {
    document.getElementById('receipt-modal').style.display = 'none';
  }

  // Close modal on backdrop click
  document.getElementById('receipt-modal').addEventListener('click', function(e) {
    if (e.target === this) closeReceipt();
  });
</script>
